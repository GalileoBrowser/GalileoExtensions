<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galileo Haptic Feedback</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <p class="eyebrow">Galileo Browser · Android</p>
    <h1>Haptic feedback</h1>
    <p class="lede">Small, deliberate vibration cues for touch navigation. The extension never records pages, URLs, or gestures.</p>

    <form id="settings-form">
      <label class="switch-row">
        <span>
          <strong>Enable haptic feedback</strong>
          <small>Turn all cues on or off.</small>
        </span>
        <input id="enabled" type="checkbox">
      </label>

      <label class="switch-row">
        <span>
          <strong>Link and button presses</strong>
          <small>A short tap when a link or control is activated.</small>
        </span>
        <input id="linkFeedback" type="checkbox">
      </label>

      <label class="switch-row">
        <span>
          <strong>Scrolling</strong>
          <small>A quiet tick after a deliberate amount of movement or when direction changes.</small>
        </span>
        <input id="scrollFeedback" type="checkbox">
      </label>

      <label class="range-row">
        <span><strong>Press strength</strong><output id="linkDurationOutput"></output></span>
        <input id="linkDuration" type="range" min="1" max="40" step="1">
      </label>

      <label class="range-row">
        <span><strong>Scroll strength</strong><output id="scrollDurationOutput"></output></span>
        <input id="scrollDuration" type="range" min="1" max="30" step="1">
      </label>

      <label class="range-row">
        <span><strong>Scroll distance</strong><output id="scrollThresholdOutput"></output></span>
        <input id="scrollThreshold" type="range" min="40" max="480" step="10">
      </label>

      <label class="range-row">
        <span><strong>Minimum time between scroll ticks</strong><output id="scrollCooldownOutput"></output></span>
        <input id="scrollCooldown" type="range" min="80" max="800" step="10">
      </label>

      <div class="actions">
        <button type="submit">Save settings</button>
        <button id="reset" class="secondary" type="button">Restore defaults</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <p class="note"><strong>Android only.</strong> Devices or browser builds without <code>navigator.vibrate()</code> safely do nothing. Haptics are never simulated with sound.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
